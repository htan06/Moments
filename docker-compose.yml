name: moments-infra

services:
  moments-rabbitmq:
    image: rabbitmq:4-management
    container_name: moments-rabbitmq
    ports:
    - "15672:15672"
    - "5672:5672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - moments-rabbitmq:/var/lib/rabbitmq
    networks:
      moments-net:
        ipv4_address: 172.18.0.5

  moments-postgres:
    image: postgres:17.10-alpine
    container_name: moments-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PWD}
      POSTGRES_DB: moments_database
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - moments-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d moments_database"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      moments-net:
        ipv4_address: 172.18.0.6

  # Chạy một lần bằng role migrator: goose migration từng module, cấp quyền cho role ứng dụng
  # (role do quản trị tạo sẵn bằng db-schema/bootstrap.sql).
  moments-migrate:
    build: ./docker/migrate
    container_name: moments-migrate
    depends_on:
      moments-postgres:
        condition: service_healthy
    environment:
      PGHOST: moments-postgres
      PGPORT: 5432
      PGDATABASE: moments_database
      PGUSER: ${POSTGRES_MIGRATOR_USER}
      PGPASSWORD: ${POSTGRES_MIGRATOR_PWD}
      POSTGRES_APPLICATION_USER: ${POSTGRES_APPLICATION_USER}
    volumes:
      - ./application/internal:/migrations:ro
      - ./db-schema/grants.sql:/sql/grants.sql:ro
    restart: "no"
    networks:
      - moments-net

  moments-redis:
    image: redis:8.2-alpine
    container_name: moments-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - moments-redis:/data
    networks:
      moments-net:
        ipv4_address: 172.18.0.7

  moments-rustfs:
    image: rustfs/rustfs:1.0.4
    container_name: moments-rustfs
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_ACCESS_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: true
      RUSTFS_OBS_LOGGER_LEVEL: error
      RUSTFS_OBS_LOG_DIRECTORY: "/var/log/rustfs/"
    volumes:
      - moments-rustfs-data:/data
      - moments-rustfs-log:/var/log/rustfs/  
    networks:
      moments-net:
        ipv4_address: 172.18.0.8

  moments-kafka-broker:
    image: apache/kafka:latest
    container_name: moments-kafka-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9094,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://moments-kafka-broker:9094,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@moments-kafka-broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
        - moments-kafka-broker:/var/lib/kafka/data
    networks:
      moments-net:
        ipv4_address: 172.18.0.9

  moments-nginx:
    image: nginx:alpine
    container_name: moments-nginx
    ports:
      - "80:80"
    volumes:
      - "./gateway/gateway.conf:/etc/nginx/nginx.conf"
    networks:
      moments-net:
        ipv4_address: 172.18.0.10

networks:
  moments-net:
    driver: bridge
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.18.0.0/16

volumes:
  # moments-scylla-1:
  # moments-scylla-2:
  # moments-scylla-3:
  # moments-scylla-4:
  moments-rabbitmq:
  moments-postgres:
  moments-redis:
  moments-rustfs-data:
  moments-rustfs-log:
  moments-kafka-broker: