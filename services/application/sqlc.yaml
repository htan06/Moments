version: "2"
sql:
  - engine: postgresql
    schema: internal/account/adapter/postgres/migrations
    queries: internal/account/adapter/postgres/queries
    gen:
      go:
        package: sqlc
        out: internal/account/adapter/postgres/sqlc
        sql_package: pgx/v5
        emit_empty_slices: true
  - engine: postgresql
    schema: internal/user/adapter/postgres/migrations
    queries: internal/user/adapter/postgres/queries
    gen:
      go:
        package: sqlc
        out: internal/user/adapter/postgres/sqlc
        sql_package: pgx/v5
        emit_empty_slices: true
