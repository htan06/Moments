syntax = "proto3";

package user;

option go_package = "github.com/htan06/Moments/grpc/user";

message ProfileSummary {
  int64 userID = 1;
  string username = 2;
  string name = 3;
  string avatarThumbnail = 4;
}

message GetProfilesSummaryInput {
  int64 currentUserID = 1;
  repeated int64 ids = 2;
}

message GetProfilesSummaryOutput {
  repeated ProfileSummary profiles = 1;
}

service UserService {
    rpc GetProfiles(GetProfilesSummaryInput) returns (GetProfilesSummaryOutput) {}
}