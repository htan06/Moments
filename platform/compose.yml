# Platform: hạ tầng dùng chung, đứng riêng với services. Dựng một lần, ít khi khởi động lại.
#   docker compose -f platform/compose.yml up -d
# ${...} lấy từ platform/.env (compose tự đọc .env cạnh file này): chỉ tài khoản quản trị hạ tầng.
# Services (migrate, api, mail, nginx) ở services/compose.yml, nối vào network moments-net.
# Volume postgres mới: chạy tay platform/postgres/init.sql (tạo role) trước khi migrate, xem hướng dẫn trong file đó.
name: moments-platform

services:
  moments-rabbitmq:
    image: rabbitmq:4-management
    container_name: moments-rabbitmq
    ports:
      - "15672:15672"
      - "5672:5672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - moments-rabbitmq:/var/lib/rabbitmq
    networks:
      moments-net:
        ipv4_address: 172.18.0.2

  moments-postgres:
    image: postgres:17.10-alpine
    container_name: moments-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PWD}
      POSTGRES_DB: moments_database
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - moments-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d moments_database"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      moments-net:
        ipv4_address: 172.18.0.3

  moments-redis:
    image: redis:8.2-alpine
    container_name: moments-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - moments-redis:/data
    networks:
      moments-net:
        ipv4_address: 172.18.0.4

  moments-rustfs:
    image: rustfs/rustfs:1.0.4
    container_name: moments-rustfs
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_ACCESS_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: true
      RUSTFS_OBS_LOGGER_LEVEL: error
      RUSTFS_OBS_LOG_DIRECTORY: "/var/log/rustfs/"
    volumes:
      - moments-rustfs-data:/data
      - moments-rustfs-log:/var/log/rustfs/
    networks:
      moments-net:
        ipv4_address: 172.18.0.5

  moments-kafka-broker:
    image: apache/kafka:latest
    container_name: moments-kafka-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9094,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://moments-kafka-broker:9094,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@moments-kafka-broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - moments-kafka-broker:/var/lib/kafka/data
    networks:
      moments-net:
        ipv4_address: 172.18.0.6

networks:
  # Tên cố định để services/compose.yml dùng lại (external).
  moments-net:
    name: moments-net
    driver: bridge
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.18.0.0/16

volumes:
  moments-rabbitmq:
  moments-postgres:
  moments-redis:
  moments-rustfs-data:
  moments-rustfs-log:
  moments-kafka-broker:
