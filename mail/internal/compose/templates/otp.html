<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{.Subject}}</title>
</head>
<body style="margin:0;padding:0;background-color:#ffffff;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#ffffff;">
  <tr>
    <td align="center" style="padding:40px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;border:1px solid #000000;">
        <tr>
          <td style="background-color:#000000;padding:20px 32px;font-family:Helvetica,Arial,sans-serif;font-size:16px;font-weight:700;letter-spacing:4px;color:#ffffff;">MOMENTS</td>
        </tr>
        <tr>
          <td style="padding:32px;font-family:Helvetica,Arial,sans-serif;color:#000000;">
            <p style="margin:0 0 8px 0;font-size:20px;line-height:28px;font-weight:700;">Verify your email</p>
            <p style="margin:0 0 24px 0;font-size:14px;line-height:22px;color:#333333;">Enter this code to verify your email address.</p>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center" style="border:2px solid #000000;padding:20px 0 20px 10px;font-family:'Courier New',Courier,monospace;font-size:32px;line-height:40px;font-weight:700;letter-spacing:10px;color:#000000;">{{.Code}}</td>
              </tr>
            </table>
            <p style="margin:24px 0 0 0;font-size:14px;line-height:22px;color:#000000;">This code expires in <strong>{{.ExpiresIn}}</strong>. Do not share it with anyone.</p>
            <p style="margin:12px 0 0 0;font-size:13px;line-height:20px;color:#666666;">If you did not request this code, you can safely ignore this email.</p>
          </td>
        </tr>
        <tr>
          <td style="border-top:1px solid #000000;padding:16px 32px;font-family:Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:#666666;">This is an automated message from Moments. Please do not reply.</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
